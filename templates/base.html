<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Document Request Ledger{% endblock %} · OAK Audit</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', 'ui-sans-serif', 'system-ui', 'Segoe UI', 'sans-serif'] } } } };
  </script>
  <style>
    body { font-feature-settings: "tnum"; }
    .drawer { transition: transform .2s ease-out; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased">
  <header class="bg-slate-900 text-slate-100">
    <div class="mx-auto flex max-w-7xl flex-wrap items-center justify-between gap-3 px-4 py-3">
      <div>
        <h1 class="text-lg font-semibold leading-tight">Document Request Ledger</h1>
      </div>
      <label class="flex items-center gap-2 text-sm">
        <span class="text-slate-400">Acting as</span>
        <input id="actor" type="text" autocomplete="off" placeholder="Your name, e.g. Priya Nair"
               class="w-60 rounded-md border border-slate-600 bg-slate-800 px-2.5 py-1.5 text-sm text-slate-100 placeholder-slate-500 focus:border-sky-400 focus:outline-none">
      </label>
    </div>
  </header>

  <main class="mx-auto max-w-7xl px-4 py-6">
    {% block content %}{% endblock %}
  </main>

  <script>
    // The "Acting as" name is remembered in this browser only (convenience, not authentication).
    const actorInput = document.getElementById('actor');
    try { actorInput.value = localStorage.getItem('oak-ledger-actor') || ''; } catch (e) {}
    actorInput.addEventListener('input', () => {
      try { localStorage.setItem('oak-ledger-actor', actorInput.value); } catch (e) {}
    });
    function currentActor() { return actorInput.value.trim(); }
  </script>
  <script>
    // Close-out: one confirmation flow, used from the dashboard and from the close-out screen.
    document.addEventListener('click', async (e) => {
      const btn = e.target.closest('[data-closeout]');
      if (!btn) return;
      const actor = currentActor();
      if (!actor) { alert("Enter your name in 'Acting as' (top right) first."); return; }
      const open = btn.dataset.open || '0', material = btn.dataset.material || '0';
      const msg = 'Close out this engagement?\n\n' +
        `- ${open} open request(s) will be FROZEN as "Unfulfilled at report date" (not deleted, not waived).\n` +
        `- ${material} of them ${material === '1' ? 'is' : 'are'} material: the EQR readiness gate will show ${material === '0' ? 'PASSED' : 'BLOCKED'}.\n` +
        '- Accepted, waived and not-applicable requests keep their state.\n' +
        '- The engagement becomes READ-ONLY: no new requests, events or uploads.\n\n' +
        'This cannot be undone.';
      if (!confirm(msg)) return;
      btn.disabled = true;
      const fd = new FormData();
      fd.set('actor', actor);
      let data = {};
      const res = await fetch(`/engagements/${btn.dataset.closeout}/close`, { method: 'POST', body: fd });
      try { data = await res.json(); } catch (x) {}
      if (!res.ok) { btn.disabled = false; alert(data.error || 'Could not close the engagement.'); return; }
      location.href = data.closeout_url || `/engagements/${btn.dataset.closeout}/close-out`;
    });
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>

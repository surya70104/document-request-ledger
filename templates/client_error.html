<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Link unavailable</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="flex min-h-screen items-center justify-center bg-slate-50 px-4 text-slate-800 antialiased">
  <main class="w-full max-w-md rounded-xl border border-slate-200 bg-white p-6 text-center shadow-sm" data-reason="{{ reason }}">
    <p class="text-xs uppercase tracking-wide text-slate-400">{{ firm_name }}</p>
    <h1 class="mt-2 text-lg font-semibold text-slate-900">This link cannot be used</h1>
    <p class="mt-3 text-sm leading-relaxed text-slate-600">{{ message }}</p>
  </main>
</body>
</html>
